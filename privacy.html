<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gizlilik Politikası – TMF Hakem İngilizcesi</title>
<style>
  :root {
    --bg: #f0f4f9;
    --card-bg: #fff;
    --text: #1a1a1a;
    --text2: #333;
    --border: #e8e8e8;
    --primary: #185FA5;
  }
  body.dark {
    --bg: #0f1117;
    --card-bg: #1e2130;
    --text: #e8eaf0;
    --text2: #9aa0b4;
    --border: #2e3348;
    --primary: #7ab0d4;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 680px; margin: 0 auto; padding: 24px 16px;
    color: var(--text); background: var(--bg);
    transition: background .3s, color .3s;
  }
  h1 { font-size: 20px; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
  h2 { font-size: 15px; color: var(--primary); margin-top: 4px; margin-bottom: 12px; }
  p, li { font-size: 14px; line-height: 1.7; color: var(--text2); }
  ul { padding-left: 20px; }
  .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
  .footer { text-align: center; font-size: 12px; color: #888; margin-top: 32px; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .lang-toggle { display:flex; justify-content:flex-end; gap:6px; margin-bottom:10px; }
  .lang-toggle button { font-size:11px; font-weight:600; padding:4px 12px; border-radius:20px;
    border:1px solid var(--border); background:var(--card-bg); color:var(--text2); cursor:pointer; }
  .lang-toggle button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
</style>
</head>
<body>

<div class="lang-toggle">
  <button id="lt-tr" onclick="setPrivacyLang('tr')">TR</button>
  <button id="lt-de" onclick="setPrivacyLang('de')">DE</button>

            "<span style=\"font-weight:500\">Rechtlicher Hinweis: Die sportartspezifische szenariobasierte Trainingsstruktur dieser Software, die speziell für die Kampfrichterrollen entwickelten interaktiven Aufgabenmodule sowie die eigenständige Anwendungsmethode zur Integration von Sprachlerntechnologien in den Bereich des Sport-Kampfrichterwesens haben den Charakter einer &quot;technischen Erfindung&quot;; die rechtlichen Registrierungs- und Patentverfahren sind noch im Gange. Die Rechte an Design, Programmierung und inhaltlicher Gestaltung dieser Software liegen bei Afra UZ.</span>"

        { h: "Kontakt",
          p: ["Bei Fragen zur App:<br><a href=\"mailto:afrauz@outlook.com\">afrauz@outlook.com</a>"] }
      ],
      footer: "Designed &amp; Developed by <strong>Afra UZ</strong> · TMF Muaythai"
    }
  };

  function renderPrivacy(lang) {
    const d = PRIVACY[lang] || PRIVACY.tr;
    document.title = d.docTitle;
    document.documentElement.lang = lang;
    let html = `<div class="card"><h1>${d.h1}</h1><p>${d.lead}</p></div>`;
    d.cards.forEach(c => {
      html += `<div class="card"><h2>${c.h}</h2>`;
      (c.p || []).forEach(p => { html += `<p>${p}</p>`; });
      if (c.ul) { html += `<ul>${c.ul.map(li => `<li>${li}</li>`).join("")}</ul>`; }
      html += `</div>`;
    });
    html += `<div class="footer">${d.footer}</div>`;
    document.getElementById('privacy-content').innerHTML = html;
    document.getElementById('lt-tr').classList.toggle('active', lang === 'tr');
    document.getElementById('lt-de').classList.toggle('active', lang === 'de');
  }
  function setPrivacyLang(lang) {
    try { localStorage.setItem('appLang', lang); } catch(e){}
    renderPrivacy(lang);
  }

  if (localStorage.getItem('darkMode') === 'true') { document.body.classList.add('dark'); }
  (function(){
    let lang = 'tr';
    try { lang = localStorage.getItem('appLang') || 'tr'; } catch(e){}
    renderPrivacy(lang);
  })();
</script>
</body>
</html>
