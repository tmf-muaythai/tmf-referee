    ko: {"docTitle": "개인정보 처리방침 – 대한무에타이협회 심판 영어", "h1": "개인정보 처리방침", "lead": "<strong>대한무에타이협회 – 심판 영어 교육 모듈</strong><br>최종 업데이트: 2026년 6월 20일", "cards": [{"h": "마이크 사용", "p": ["이 앱은 시나리오 연습 섹션의 발음 확인을 위해 선택적으로 마이크 접근을 요청할 수 있습니다."], "ul": ["마이크는 버튼을 눌렀을 때만 작동합니다.", "음성 데이터는 어떤 서버로도 전송되거나 저장되지 않습니다.", "음성 인식은 전적으로 기기의 브라우저에서 처리됩니다.", "앱은 어떤 음성 녹음도 생성하지 않습니다.", "마이크 권한은 언제든지 브라우저 설정에서 해제할 수 있습니다."]}, {"h": "데이터 수집", "p": ["이 앱은 어떠한 개인정보도 수집하지 않습니다."], "ul": ["사용자 계정이나 가입 시스템이 없습니다.", "쿠키를 사용하지 않습니다.", "분석 또는 추적 도구를 사용하지 않습니다.", "어떤 사용자 데이터도 제3자와 공유하지 않습니다."]}, {"h": "호스팅", "p": ["앱은 <strong>GitHub Pages</strong>에서 호스팅됩니다. 음성 파일을 포함한 모든 콘텐츠는 정적 파일로 구성됩니다. 백엔드 서버는 없습니다.", "GitHub의 개인정보 처리방침은 여기에서 확인할 수 있습니다: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\">GitHub Privacy Statement</a>"]}, {"h": "음성 콘텐츠", "ul": ["앱의 영어 음성은 AI 음성 기술 <strong>ElevenLabs</strong>의 상업용 라이선스에 따라 제작·사용되었습니다.", "태국어 음성은 Google Text-to-Speech 기술로 생성되었습니다.", "모든 음성 콘텐츠는 협회 심판들의 언어 교육에 기여하기 위해 프로젝트에 통합되었습니다."]}, {"h": "앱 소개", "p": ["이 앱은 <strong>2026년 6월 3일</strong> <strong>국제 무에타이 심판이자 외국어 교사인 Afra UZ</strong>가 튀르키예 무에타이 협회 심판진의 국제 대회 영어 소통 역량을 높이기 위해 설계·개발했습니다.", "앱의 모든 교육 자료와 용어는 협회 공식 규정의 영어 번역을 직접 수행한 개발자가 교육학 원칙에 따라 세심하게 준비했습니다.", "<span style=\"font-weight:500\">법적 고지: 이 소프트웨어의 종목 특화 시나리오 기반 교육 구조, 심판 역할을 위해 특별히 개발된 인터랙티브 과제 모듈, 그리고 언어 학습 기술을 스포츠 심판 분야에 통합한 독창적 활용 방식은 &quot;기술적 발명&quot;의 성격을 가지며, 법적 등록 및 특허 절차가 진행 중입니다. 이 소프트웨어의 디자인, 코딩, 콘텐츠 편집 권리는 Afra UZ에게 있습니다.</span>"]}, {"h": "문의", "p": ["앱에 관한 문의:<br><a href=\"mailto:afrauz@outlook.com\">afrauz@outlook.com</a>"]}], "footer": "Designed &amp; Developed by <strong>Afra UZ</strong> · TMF Muaythai", "home": "← 홈"},
    th: {"docTitle": "นโยบายความเป็นส่วนตัว – IFMA ภาษาอังกฤษสำหรับผู้ตัดสิน", "h1": "นโยบายความเป็นส่วนตัว", "lead": "<strong>IFMA มวยไทย – โมดูลฝึกภาษาอังกฤษสำหรับผู้ตัดสิน</strong><br>อัปเดตล่าสุด: 20 มิถุนายน 2026", "cards": [{"h": "การใช้ไมโครโฟน", "p": ["แอปนี้อาจขอสิทธิ์เข้าถึงไมโครโฟนของคุณแบบไม่บังคับ เพื่อตรวจการออกเสียงในส่วนแบบฝึกสถานการณ์"], "ul": ["ไมโครโฟนทำงานเฉพาะเมื่อคุณกดปุ่มเท่านั้น", "ข้อมูลเสียงจะไม่ถูกส่งไปยังเซิร์ฟเวอร์ใด ๆ และไม่ถูกจัดเก็บ", "การรู้จำเสียงประมวลผลทั้งหมดภายในเบราว์เซอร์ของอุปกรณ์คุณ", "แอปไม่สร้างการบันทึกเสียงใด ๆ", "คุณสามารถยกเลิกสิทธิ์ไมโครโฟนได้ทุกเมื่อในการตั้งค่าเบราว์เซอร์"]}, {"h": "การเก็บข้อมูล", "p": ["แอปนี้ไม่เก็บข้อมูลส่วนบุคคลใด ๆ"], "ul": ["ไม่มีบัญชีผู้ใช้หรือระบบลงทะเบียน", "ไม่มีการใช้คุกกี้", "ไม่มีการใช้เครื่องมือวิเคราะห์หรือติดตาม", "ไม่มีการแบ่งปันข้อมูลผู้ใช้กับบุคคลที่สาม"]}, {"h": "การโฮสต์", "p": ["แอปนี้โฮสต์บน <strong>GitHub Pages</strong> เนื้อหาทั้งหมดรวมถึงไฟล์เสียงเป็นไฟล์แบบสแตติก ไม่มีเซิร์ฟเวอร์แบ็กเอนด์", "คุณสามารถอ่านนโยบายความเป็นส่วนตัวของ GitHub ได้ที่นี่: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\">GitHub Privacy Statement</a>"]}, {"h": "เนื้อหาเสียง", "ul": ["เสียงภาษาอังกฤษในแอปสร้างและใช้งานภายใต้ใบอนุญาตเชิงพาณิชย์ของเทคโนโลยีเสียง AI <strong>ElevenLabs</strong>", "เสียงภาษาไทยสร้างด้วยเทคโนโลยี Google Text-to-Speech", "เนื้อหาเสียงทั้งหมดถูกรวมไว้ในโครงการเพื่อสนับสนุนการฝึกภาษาของผู้ตัดสินในสหพันธ์"]}, {"h": "เกี่ยวกับแอป", "p": ["แอปนี้ออกแบบและพัฒนาเมื่อ <strong>3 มิถุนายน 2026</strong> โดย <strong>Afra UZ ผู้ตัดสินมวยไทยระดับนานาชาติและครูสอนภาษาต่างประเทศ</strong> เพื่อยกระดับความสามารถในการสื่อสารภาษาอังกฤษของผู้ตัดสินสหพันธ์มวยไทยตุรกีในการแข่งขันระดับนานาชาติ", "สื่อการเรียนการสอนและคำศัพท์ทั้งหมดในแอปจัดทำอย่างพิถีพิถันตามหลักการสอน โดยผู้พัฒนาซึ่งเป็นผู้แปลระเบียบทางการของสหพันธ์เป็นภาษาอังกฤษด้วยตนเอง", "<span style=\"font-weight:500\">ประกาศทางกฎหมาย: โครงสร้างการฝึกอบรมแบบอิงสถานการณ์เฉพาะกีฬา โมดูลภารกิจแบบโต้ตอบที่พัฒนาขึ้นเป็นพิเศษสำหรับบทบาทของผู้ตัดสิน และวิธีการใช้งานอันเป็นเอกลักษณ์ที่ผสานเทคโนโลยีการเรียนภาษาเข้ากับงานตัดสินกีฬา มีลักษณะเป็น &quot;สิ่งประดิษฐ์ทางเทคนิค&quot; ซึ่งกระบวนการจดทะเบียนและสิทธิบัตรกำลังดำเนินการอยู่ สิทธิ์ในการออกแบบ การเขียนโค้ด และการจัดทำเนื้อหาของซอฟต์แวร์นี้เป็นของ Afra UZ</span>"]}, {"h": "ติดต่อ", "p": ["สำหรับคำถามเกี่ยวกับแอป:<br><a href=\"mailto:afrauz@outlook.com\">afrauz@outlook.com</a>"]}], "footer": "Designed &amp; Developed by <strong>Afra UZ</strong> · TMF Muaythai", "home": "← หน้าแรก"},
    nl: {"docTitle": "Privacybeleid – MON Engels voor scheidsrechters", "h1": "Privacybeleid", "lead": "<strong>MON Muaythai – Engelse trainingsmodule voor scheidsrechters</strong><br>Laatst bijgewerkt: 20 juni 2026", "cards": [{"h": "Gebruik van de microfoon", "p": ["Deze app kan optioneel toegang tot je microfoon vragen om de uitspraak te controleren in het onderdeel Scenario-oefening."], "ul": ["De microfoon werkt alleen wanneer je op de knop drukt.", "Er worden geen audiogegevens naar een server verzonden of opgeslagen.", "De spraakherkenning wordt volledig verwerkt in de browser van je apparaat.", "De app maakt geen enkele geluidsopname.", "Je kunt de microfoontoestemming op elk moment intrekken in de browserinstellingen."]}, {"h": "Gegevensverzameling", "p": ["Deze app verzamelt geen enkel persoonsgegeven."], "ul": ["Er is geen gebruikersaccount of registratiesysteem.", "Er worden geen cookies gebruikt.", "Er worden geen analyse- of trackingtools gebruikt.", "Er worden geen gebruikersgegevens met derden gedeeld."]}, {"h": "Hosting", "p": ["De app wordt gehost op <strong>GitHub Pages</strong>. Alle inhoud, inclusief de audiobestanden, bestaat uit statische bestanden. Er is geen backendserver.", "Je kunt het privacybeleid van GitHub hier lezen: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\">GitHub Privacy Statement</a>"]}, {"h": "Audio-inhoud", "ul": ["De Engelse stemmen in de app zijn gegenereerd en gebruikt onder de commerciële licentie van de AI-stemtechnologie <strong>ElevenLabs</strong>.", "De Thaise stemmen zijn gemaakt met Google Text-to-Speech-technologie.", "Alle audio-inhoud is in het project geïntegreerd om bij te dragen aan de taaltraining van de scheidsrechters van de federatie."]}, {"h": "Over de app", "p": ["Deze app is op <strong>3 juni 2026</strong> ontworpen en ontwikkeld door <strong>Afra UZ, internationaal Muaythai-scheidsrechter en docent vreemde talen</strong>, om de Engelse communicatievaardigheden van de scheidsrechters van de Turkse Muaythai-federatie bij internationale wedstrijden te verbeteren.", "Al het lesmateriaal en de terminologie in de app zijn met de grootste zorg en volgens didactische principes voorbereid door de ontwikkelaar, die zelf de Engelse vertaling van het officiële reglement van de federatie heeft gemaakt.", "<span style=\"font-weight:500\">Juridische kennisgeving: de sportspecifieke, op scenario's gebaseerde trainingsstructuur, de speciaal voor scheidsrechtersrollen ontwikkelde interactieve taakmodules en de originele gebruiksmethode die taalleertechnologieën integreert in de sportscheidsrechterij, hebben het karakter van een &quot;technische uitvinding&quot;; de juridische registratie- en octrooiprocedures zijn in behandeling. De rechten op ontwerp, programmering en inhoudsredactie van deze software behoren toe aan Afra UZ.</span>"]}, {"h": "Contact", "p": ["Voor vragen over de app:<br><a href=\"mailto:afrauz@outlook.com\">afrauz@outlook.com</a>"]}], "footer": "Designed &amp; Developed by <strong>Afra UZ</strong> · TMF Muaythai", "home": "← Startpagina"},
    it: {"docTitle": "Informativa sulla privacy – FederKombat Inglese per arbitri", "h1": "Informativa sulla privacy", "lead": "<strong>FederKombat Muay Thai – Modulo di inglese per arbitri</strong><br>Ultimo aggiornamento: 20 giugno 2026", "cards": [{"h": "Uso del microfono", "p": ["Questa app può, in modo facoltativo, richiedere l'accesso al microfono per il controllo della pronuncia nella sezione Esercizio su scenari."], "ul": ["Il microfono si attiva solo quando premi il pulsante.", "Nessun dato audio viene inviato a un server né memorizzato.", "Il riconoscimento vocale viene elaborato interamente nel browser del tuo dispositivo.", "L'app non crea alcuna registrazione audio.", "Puoi revocare l'autorizzazione al microfono in qualsiasi momento nelle impostazioni del browser."]}, {"h": "Raccolta dei dati", "p": ["Questa app non raccoglie alcun dato personale."], "ul": ["Non esiste alcun account utente né sistema di registrazione.", "Non vengono utilizzati cookie.", "Non vengono utilizzati strumenti di analisi o tracciamento.", "Nessun dato dell'utente viene condiviso con terze parti."]}, {"h": "Hosting", "p": ["L'app è ospitata su <strong>GitHub Pages</strong>. Tutti i contenuti, compresi i file audio, sono file statici. Non esiste alcun server backend.", "Puoi consultare l'informativa sulla privacy di GitHub qui: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\">GitHub Privacy Statement</a>"]}, {"h": "Contenuti audio", "ul": ["Le voci inglesi dell'app sono state generate e utilizzate nell'ambito della licenza commerciale della tecnologia vocale IA <strong>ElevenLabs</strong>.", "Le voci thai sono state create con la tecnologia Google Text-to-Speech.", "Tutti i contenuti audio sono stati integrati nel progetto per contribuire alla formazione linguistica degli arbitri della federazione."]}, {"h": "Informazioni sull'app", "p": ["Questa app è stata ideata e sviluppata il <strong>3 giugno 2026</strong> da <strong>Afra UZ, arbitro internazionale di Muaythai e insegnante di lingue straniere</strong>, per migliorare le competenze di comunicazione in inglese degli arbitri della Federazione turca di Muaythai nelle competizioni internazionali.", "Tutto il materiale didattico e la terminologia dell'app sono stati preparati con la massima cura, secondo principi pedagogici, dalla sviluppatrice che ha personalmente realizzato la traduzione inglese del regolamento ufficiale della federazione.", "<span style=\"font-weight:500\">Avviso legale: la struttura di formazione basata su scenari specifica per lo sport, i moduli di compiti interattivi sviluppati appositamente per i ruoli arbitrali e il metodo d'uso originale che integra le tecnologie di apprendimento linguistico nell'ambito dell'arbitraggio sportivo hanno il carattere di una &quot;invenzione tecnica&quot;; le procedure legali di registrazione e brevetto sono in corso. I diritti di progettazione, programmazione e redazione dei contenuti di questo software appartengono ad Afra UZ.</span>"]}, {"h": "Contatti", "p": ["Per domande sull'app:<br><a href=\"mailto:afrauz@outlook.com\">afrauz@outlook.com</a>"]}], "footer": "Designed &amp; Developed by <strong>Afra UZ</strong> · TMF Muaythai", "home": "← Home"},
    el: {"docTitle": "Πολιτική απορρήτου – PMF Αγγλικά για διαιτητές", "h1": "Πολιτική απορρήτου", "lead": "<strong>PMF Muay Thai – Ενότητα αγγλικών για διαιτητές</strong><br>Τελευταία ενημέρωση: 20 Ιουνίου 2026", "cards": [{"h": "Χρήση μικροφώνου", "p": ["Αυτή η εφαρμογή μπορεί, προαιρετικά, να ζητήσει πρόσβαση στο μικρόφωνο για τον έλεγχο προφοράς στην ενότητα Άσκηση σεναρίων."], "ul": ["Το μικρόφωνο ενεργοποιείται μόνο όταν πατάς το κουμπί.", "Κανένα ηχητικό δεδομένο δεν αποστέλλεται σε διακομιστή ούτε αποθηκεύεται.", "Η αναγνώριση φωνής επεξεργάζεται εξ ολοκλήρου στον browser της συσκευής σου.", "Η εφαρμογή δεν δημιουργεί καμία ηχογράφηση.", "Μπορείς να ανακαλέσεις την άδεια μικροφώνου οποιαδήποτε στιγμή από τις ρυθμίσεις του browser."]}, {"h": "Συλλογή δεδομένων", "p": ["Αυτή η εφαρμογή δεν συλλέγει κανένα προσωπικό δεδομένο."], "ul": ["Δεν υπάρχει λογαριασμός χρήστη ούτε σύστημα εγγραφής.", "Δεν χρησιμοποιούνται cookies.", "Δεν χρησιμοποιούνται εργαλεία ανάλυσης ή παρακολούθησης.", "Κανένα δεδομένο χρήστη δεν κοινοποιείται σε τρίτους."]}, {"h": "Φιλοξενία (Hosting)", "p": ["Η εφαρμογή φιλοξενείται στο <strong>GitHub Pages</strong>. Όλο το περιεχόμενο, συμπεριλαμβανομένων των αρχείων ήχου, είναι στατικά αρχεία. Δεν υπάρχει διακομιστής backend.", "Μπορείς να δεις την πολιτική απορρήτου του GitHub εδώ: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\">GitHub Privacy Statement</a>"]}, {"h": "Ηχητικό περιεχόμενο", "ul": ["Οι αγγλικές φωνές της εφαρμογής δημιουργήθηκαν και χρησιμοποιήθηκαν στο πλαίσιο της εμπορικής άδειας της τεχνολογίας φωνής AI <strong>ElevenLabs</strong>.", "Οι ταϊλανδικές φωνές δημιουργήθηκαν με την τεχνολογία Google Text-to-Speech.", "Όλο το ηχητικό περιεχόμενο ενσωματώθηκε στο έργο για να συμβάλει στη γλωσσική εκπαίδευση των διαιτητών της ομοσπονδίας."]}, {"h": "Σχετικά με την εφαρμογή", "p": ["Αυτή η εφαρμογή σχεδιάστηκε και αναπτύχθηκε στις <strong>3 Ιουνίου 2026</strong> από την <strong>Afra UZ, διεθνή διαιτητή Muaythai και καθηγήτρια ξένων γλωσσών</strong>, για τη βελτίωση των δεξιοτήτων επικοινωνίας στα αγγλικά των διαιτητών της Τουρκικής Ομοσπονδίας Muaythai στις διεθνείς διοργανώσεις.", "Όλο το εκπαιδευτικό υλικό και η ορολογία της εφαρμογής προετοιμάστηκαν με τη μέγιστη προσοχή, σύμφωνα με παιδαγωγικές αρχές, από την αναπτύκτρια που πραγματοποίησε προσωπικά την αγγλική μετάφραση του επίσημου κανονισμού της ομοσπονδίας.", "<span style=\"font-weight:500\">Νομική ειδοποίηση: η δομή εκπαίδευσης βασισμένη σε σενάρια ειδικά για το άθλημα, οι διαδραστικές ενότητες καθηκόντων που αναπτύχθηκαν ειδικά για τους ρόλους διαιτησίας και η πρωτότυπη μέθοδος χρήσης που ενσωματώνει τις τεχνολογίες εκμάθησης γλωσσών στο πλαίσιο της αθλητικής διαιτησίας έχουν τον χαρακτήρα &quot;τεχνικής εφεύρεσης&quot;· οι νομικές διαδικασίες κατοχύρωσης και ευρεσιτεχνίας βρίσκονται σε εξέλιξη. Τα δικαιώματα σχεδιασμού, προγραμματισμού και σύνταξης του περιεχομένου αυτού του λογισμικού ανήκουν στην Afra UZ.</span>"]}, {"h": "Επικοινωνία", "p": ["Για ερωτήσεις σχετικά με την εφαρμογή:<br><a href=\"mailto:afrauz@outlook.com\">afrauz@outlook.com</a>"]}], "footer": "Designed &amp; Developed by <strong>Afra UZ</strong> · TMF Muaythai", "home": "← Home"},
    uk: {"docTitle": "Політика конфіденційності – UMF Англійська для суддів", "h1": "Політика конфіденційності", "lead": "<strong>UMF Muay Thai – Модуль англійської для суддів</strong><br>Останнє оновлення: 20 червня 2026", "cards": [{"h": "Використання мікрофона", "p": ["Цей застосунок може за бажанням запитати доступ до мікрофона для перевірки вимови в розділі «Практика сценаріїв»."], "ul": ["Мікрофон вмикається лише тоді, коли ти натискаєш кнопку.", "Жодні аудіодані не надсилаються на сервер і не зберігаються.", "Розпізнавання мовлення повністю обробляється у браузері твого пристрою.", "Застосунок не створює жодного аудіозапису.", "Ти можеш відкликати дозвіл на мікрофон будь-коли в налаштуваннях браузера."]}, {"h": "Збір даних", "p": ["Цей застосунок не збирає жодних персональних даних."], "ul": ["Немає облікового запису користувача чи системи реєстрації.", "Файли cookie не використовуються.", "Інструменти аналітики чи відстеження не використовуються.", "Жодні дані користувача не передаються третім сторонам."]}, {"h": "Хостинг (Hosting)", "p": ["Застосунок розміщено на <strong>GitHub Pages</strong>. Увесь вміст, зокрема аудіофайли, є статичними файлами. Backend-сервера немає.", "Ти можеш переглянути політику конфіденційності GitHub тут: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\">GitHub Privacy Statement</a>"]}, {"h": "Аудіовміст", "ul": ["Англійські голоси застосунку були згенеровані та використані в межах комерційної ліцензії технології ШІ-голосу <strong>ElevenLabs</strong>.", "Тайські голоси створено за допомогою технології Google Text-to-Speech.", "Увесь аудіовміст інтегровано в проєкт для сприяння мовній підготовці суддів федерації."]}, {"h": "Про застосунок", "p": ["Цей застосунок був розроблений <strong>3 червня 2026 року</strong> <strong>Afra UZ, міжнародною суддею Muaythai та викладачкою іноземних мов</strong>, для покращення навичок англомовного спілкування суддів Турецької федерації Muaythai на міжнародних змаганнях.", "Увесь навчальний матеріал і термінологія застосунку підготовлені з максимальною ретельністю, згідно з педагогічними принципами, розробницею, яка особисто виконала англійський переклад офіційного регламенту федерації.", "<span style=\"font-weight:500\">Правове повідомлення: спортивно-специфічна структура навчання на основі сценаріїв, інтерактивні модулі завдань, розроблені спеціально для суддівських ролей, і оригінальний метод використання, що інтегрує технології вивчення мов у контекст спортивного суддівства, мають характер &quot;технічного винаходу&quot;; правові процедури реєстрації та патентування тривають. Права на дизайн, програмування та укладання вмісту цього програмного забезпечення належать Afra UZ.</span>"]}, {"h": "Контакти", "p": ["Із питаннями щодо застосунку:<br><a href=\"mailto:afrauz@outlook.com\">afrauz@outlook.com</a>"]}], "footer": "Designed &amp; Developed by <strong>Afra UZ</strong> · TMF Muaythai", "home": "← Home"}
  };

  function renderPrivacy(lang) {
    const d = PRIVACY[lang] || PRIVACY.tr;
    document.title = d.docTitle;
    document.documentElement.lang = lang;
    let html = `<div class="card"><h1>${d.h1}</h1><p>${d.lead}</p></div>`;
    d.cards.forEach(c => {
      html += `<div class="card"><h2>${c.h}</h2>`;
      (c.p || []).forEach(p => { html += `<p>${p}</p>`; });
      if (c.ul) { html += `<ul>${c.ul.map(li => `<li>${li}</li>`).join("")}</ul>`; }
      html += `</div>`;
    });
    html += `<div class="footer">${d.footer}</div>`;
    document.getElementById('privacy-content').innerHTML = html;
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    ['tr','de','ar','fr','ko','th','nl','it','el','uk'].forEach(function(l){
      var b = document.getElementById('lt-'+l); if(b) b.classList.toggle('active', lang === l);
    });
    var hb = document.getElementById('pp-home'); if(hb && d.home) hb.textContent = d.home;
  }
  function setPrivacyLang(lang) {
    try { localStorage.setItem('appLang', lang); } catch(e){}
    renderPrivacy(lang);
  }

  if (localStorage.getItem('darkMode') === 'true') { document.body.classList.add('dark'); }
  (function(){
    let lang = 'tr';
    try { lang = localStorage.getItem('appLang') || 'tr'; } catch(e){}
    renderPrivacy(lang);
  })();
</script>
